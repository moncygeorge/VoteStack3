{% extends "base.html" %}

{% block content %}
  <h1>View and Delete Voters</h1>

  <!-- Delete All Form -->
  <form action="{{ url_for('delete_all_voters') }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete all voters?');">
    <button type="submit" class="btn btn-danger">Delete All</button>
  </form>
  <br><br>

  {% if not usernames %}
    <p>No users found.</p>
  {% else %}
    <ul>
      {% for username in usernames %}
        <li>
          {{ username }}
          <form action="{{ url_for('delete_voter', username=username) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this voter?');">
            <button type="submit" class="btn btn-danger">Delete</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% endif %}

  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
{% endblock %}
