<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Setup – Votestack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .setup-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h4 {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }
        .toggle-password {
            position: relative;
        }
        .toggle-password .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            font-size: 16px;
            padding: 0;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="text-center">
        <div class="setup-badge">One-time Setup</div>
        <h4>Create Admin Account</h4>
        <p class="subtitle">This page is only available until an admin account is created.</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/setup_admin">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control"
                   placeholder="e.g. admin" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="toggle-password">
                <input type="password" name="password" id="password"
                       class="form-control pe-5"
                       placeholder="Min. 8 characters"
                       autocomplete="new-password" required>
                <button type="button" class="eye-btn" onclick="togglePw('password')">👁</button>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Confirm Password</label>
            <div class="toggle-password">
                <input type="password" name="confirm" id="confirm"
                       class="form-control pe-5"
                       placeholder="Re-enter password"
                       autocomplete="new-password" required>
                <button type="button" class="eye-btn" onclick="togglePw('confirm')">👁</button>
            </div>
        </div>
        <button type="submit" class="btn btn-danger w-100 fw-semibold">Create Admin Account</button>
    </form>
</div>

<script>
    function togglePw(id) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }
</script>
</body>
</html>
